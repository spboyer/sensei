name: Package Sensei skill

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
      - references/**
      - scripts/**
      - package.json
      - .token-limits.json
      - agent-registry.json
      - README.md
      - LICENSE.txt
      - .github/workflows/package-skill.yml
  pull_request:
    paths:
      - SKILL.md
      - references/**
      - scripts/**
      - package.json
      - .token-limits.json
      - agent-registry.json
      - README.md
      - LICENSE.txt
      - .github/workflows/package-skill.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test bundle contract
        run: node --test scripts/package-skill.test.mjs

      - name: Package committed skill source
        run: node scripts/package-skill.mjs "$RUNNER_TEMP/sensei-bundle"

      - name: Verify archive checksum
        working-directory: ${{ runner.temp }}/sensei-bundle
        run: sha256sum --check SHA256SUMS

      - name: Publish main-branch bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sensei-skill-${{ github.sha }}
          path: ${{ runner.temp }}/sensei-bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Report bundle provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Sensei source bundle"
            echo "Source commit: $SOURCE_SHA"
            echo 'Payload is committed source only; dependencies and compiled CLI are not installed.'
            echo 'Downstream dotfiles sync remains pull-based and opens reviewable PRs.'
            cat "$RUNNER_TEMP/sensei-bundle/SHA256SUMS"
          } >> "$GITHUB_STEP_SUMMARY"
