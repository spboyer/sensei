name: Squad Protected Branch Guard

on:
  pull_request:
    branches: [main, preview]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Test protected branch path policy
        run: node --test .github/scripts/squad-main-guard.test.mjs

      - name: Check for forbidden paths
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { isForbiddenTeamChange } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/squad-main-guard.mjs`
            ).href);

            // Fetch all files changed in this PR (paginated)
            const files = [];
            let page = 1;
            while (true) {
              const resp = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
                page
              });
              files.push(...resp.data);
              if (resp.data.length < 100) break;
              page++;
            }

            const forbidden = files.filter(isForbiddenTeamChange).map(f => f.filename);

            if (forbidden.length === 0) {
              core.info('✅ No forbidden paths found in PR — all clear.');
              return;
            }

            // Build a clear, actionable error message
            const lines = [
              '## 🚫 Forbidden files detected in PR to a protected branch',
              '',
              'The following files must NOT be merged into `main` or `preview`.',
              'Only reviewed `.ai-team/team.md`, `.ai-team/decisions.md`, and',
              '`.ai-team/agents/<one-level-agent>/charter.md` are allowed team policy files.',
              'All other `.ai-team/` state and all `team-docs` content remain blocked.',
              'Removals are allowed; renamed files are checked by their destination.',
              '',
              '### Forbidden files found:',
              '',
              ...forbidden.map(f => `- \`${f}\``),
              '',
              '### How to fix:',
              '',
              'Exclude the listed runtime/internal files from this PR, or remove them if cleanup is intended.',
              'Keep reviewed curated policy files; do not untrack the entire `.ai-team/` directory.',
            ];

            core.setFailed(lines.join('\n'));
