name: Sensei
description: Validate, score, and analyze Agent Skills with Sensei.

inputs:
  command:
    description: "Sensei command to run: check, count, suggest, score, or analyze."
    required: false
    default: check
  path:
    description: File, directory, or skill path to pass to the command.
    required: false
    default: .
  root:
    description: Project root for path resolution and default config discovery.
    required: false
    default: .
  config:
    description: Optional token limits JSON file.
    required: false
    default: ''
  strict:
    description: Fail check when any file exceeds its limit.
    required: false
    default: 'true'
  format:
    description: Output format, usually table or json.
    required: false
    default: table
  profile:
    description: "Frontmatter profile for score: portable or copilot."
    required: false
    default: portable
  node-version:
    description: Node.js version to use.
    required: false
    default: '22'
  package-version:
    description: "Deprecated: the Action ref now selects the Sensei version."
    required: false
    default: ''
  emit-proof:
    description: Path to write sensei-audit.md proof artifact (score command only). Empty disables.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run Sensei
      shell: bash
      env:
        SENSEI_COMMAND: ${{ inputs.command }}
        SENSEI_PATH: ${{ inputs.path }}
        SENSEI_ROOT: ${{ inputs.root }}
        SENSEI_CONFIG: ${{ inputs.config }}
        SENSEI_STRICT: ${{ inputs.strict }}
        SENSEI_FORMAT: ${{ inputs.format }}
        SENSEI_PROFILE: ${{ inputs.profile }}
        SENSEI_PACKAGE_VERSION: ${{ inputs.package-version }}
        SENSEI_EMIT_PROOF: ${{ inputs.emit-proof }}
      run: |
        set -euo pipefail

        case "$SENSEI_COMMAND" in
          check|count|suggest|score|analyze) ;;
          *)
            echo "Unsupported Sensei command: $SENSEI_COMMAND" >&2
            exit 1
            ;;
        esac

        args=("$SENSEI_COMMAND")

        if [[ -n "$SENSEI_ROOT" ]]; then
          args+=("--root" "$SENSEI_ROOT")
        fi

        if [[ -n "$SENSEI_CONFIG" ]]; then
          args+=("--config" "$SENSEI_CONFIG")
        fi

        if [[ -n "$SENSEI_FORMAT" ]]; then
          args+=("--format=$SENSEI_FORMAT")
        fi

        if [[ "$SENSEI_COMMAND" == "check" && "$SENSEI_STRICT" == "true" ]]; then
          args+=("--strict")
        fi

        if [[ "$SENSEI_COMMAND" == "score" && -n "$SENSEI_EMIT_PROOF" ]]; then
          args+=("--emit-proof=$SENSEI_EMIT_PROOF")
        fi

        if [[ "$SENSEI_COMMAND" == "score" && -n "$SENSEI_PROFILE" ]]; then
          args+=("--profile=$SENSEI_PROFILE")
        fi

        if [[ -n "$SENSEI_PATH" ]]; then
          args+=("$SENSEI_PATH")
        fi

        if [[ -n "$SENSEI_PACKAGE_VERSION" ]]; then
          echo "::warning::package-version is deprecated; pin the Action ref instead."
          npx --yes "@spboyer/sensei@$SENSEI_PACKAGE_VERSION" "${args[@]}"
          exit 0
        fi

        npm ci --prefix "$GITHUB_ACTION_PATH/scripts" --include=dev
        node \
          "$GITHUB_ACTION_PATH/scripts/node_modules/tsx/dist/cli.mjs" \
          "$GITHUB_ACTION_PATH/scripts/src/tokens/cli.ts" \
          "${args[@]}"
